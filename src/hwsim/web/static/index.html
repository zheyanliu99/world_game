<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agentic Three Kingdoms</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23251f19'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='34'%3E%E5%85%B5%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="battlefield">
        <canvas id="mapCanvas" aria-label="Three Kingdoms strategy map"></canvas>

        <div class="year-panel">
          <div id="roundLine" class="round-line">Round 0 / 100</div>
          <span id="statusPill" class="status-pill">待命</span>
        </div>

        <div class="edict-panel">
          <h1>Agentic Three Kingdoms</h1>
          <p id="edictText">蜀汉军议：结吴、守汉中、探荆州，一百回合内争天下。</p>
        </div>

        <aside class="score-panel">
          <h2>势力排名</h2>
          <div id="factionList" class="faction-list"></div>
        </aside>

        <div id="winnerBanner" class="winner-banner" hidden></div>

        <section class="command-dock">
          <div class="command-panel">
            <div class="panel-head">
              <h2>蜀汉军令</h2>
              <div class="top-actions">
                <button id="newGameBtn" type="button">新局</button>
                <button id="saveBtn" type="button">保存</button>
                <button id="resolveBtn" type="button" class="primary">结算回合</button>
              </div>
            </div>
            <textarea id="strategyInput" rows="3">Form alliance with Wu, defend Hanzhong, scout Jingzhou, and prepare weapons for a northern attack.</textarea>
            <div id="policyButtons" class="segmented"></div>
            <div id="orderDrafts" class="drafts"></div>
          </div>

          <div class="advisor-panel">
            <div class="panel-head">
              <h2>军师建议</h2>
              <button id="applyAdvisorBtn" type="button" class="quiet">采用</button>
            </div>
            <div id="advisorSummary" class="advisor-summary">等待军师推演。</div>
            <div id="advisorList" class="advisor-list"></div>
          </div>

          <div class="orders-panel">
            <div class="panel-head">
              <h2>部队</h2>
              <button id="clearOrdersBtn" type="button" class="quiet">清空</button>
            </div>
            <div id="unitList" class="unit-list"></div>
            <div class="diplomacy-row">
              <button id="allyWuBtn" type="button">联吴</button>
              <button id="breakWuBtn" type="button">破盟</button>
            </div>
          </div>
        </section>

        <section class="log-panel">
          <h2>战报</h2>
          <div id="logList" class="log-list"></div>
        </section>
      </section>

      <section class="intel-panel">
        <h2>诸方意图</h2>
        <div id="intentList" class="intent-list"></div>
        <h2>战役细节</h2>
        <div id="battleList" class="battle-list"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
