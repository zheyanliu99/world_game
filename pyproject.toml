[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-war-sim"
version = "0.1.0"
description = "Config-driven historical war simulation video generator demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.6,<3",
  "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
